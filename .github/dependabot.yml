version: 2
updates:
  - package-ecosystem: npm
    directory: /
    versioning-strategy: increase
    open-pull-requests-limit: 20
    schedule:
      interval: weekly
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
    ignore:
      # Majors above these are esm-only, breaking cjs consumers (jest, ts-node)
      - dependency-name: "query-string"
        update-types: ["version-update:semver-major"]
      - dependency-name: "arrify"
        update-types: ["version-update:semver-major"]
      - dependency-name: "p-timeout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "change-case"
        update-types: ["version-update:semver-major"]
      - dependency-name: "flat"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/flat"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
